<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2814">
<title>Приглашение</title>
<meta property="og:title" content="Вам приглашение 💌">
<meta property="og:description" content="Откройте конверт">
<style>
@font-face{font-family:"Cormorant";src:url(fonts/CormorantGaramond[wght].ttf) format("truetype");font-weight:300 700;font-display:swap}
@font-face{font-family:"Cormorant";src:url(fonts/CormorantGaramond-Italic[wght].ttf) format("truetype");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:"Vibes";src:url(fonts/GreatVibes-Regular.ttf) format("truetype");font-display:swap}
:root{
  --paper:#f3ebdd; --paper2:#e8dcc6; --liner:#c9a35a; --seal:#7a1e2b; --seal2:#4f0f19; --ink:#3a2814;
  --gold:#b8893a; --soft:#6b5236; --sheet:#fbf6ee;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1c130c;color:var(--ink);font-family:"Cormorant",Georgia,serif}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- сцена с конвертом ---------- */
.scene{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.backdrop{position:absolute;inset:-30px;background:center/cover no-repeat;filter:brightness(.86) saturate(1.2);transform:scale(1.05)}
.backdrop:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 55%,rgba(255,236,200,.35),transparent 70%),radial-gradient(ellipse 80% 70% at 50% 50%,transparent 45%,rgba(40,22,8,.45))}
.intro{position:absolute;top:calc(9vh + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fbf2e2;
  text-shadow:0 2px 12px rgba(0,0,0,.45);transition:opacity .6s}
.intro p{font-style:italic;font-size:clamp(18px,5vw,24px);opacity:.92}
.intro h1{font-family:"Vibes",cursive;font-weight:400;font-size:clamp(40px,12vw,64px);line-height:1.15;margin-top:.15em}
.hint{position:absolute;bottom:calc(10vh + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#f6e8cf;
  font-style:italic;font-size:18px;opacity:.9;transition:opacity .5s}

.env{position:relative;width:min(88vw,420px);aspect-ratio:1.42;perspective:1400px;margin-top:6vh}
.env .back{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,var(--paper),var(--paper2));
  box-shadow:0 30px 60px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.25)}
.env .liner{position:absolute;inset:8px 8px auto 8px;height:58%;border-radius:4px;
  background:repeating-linear-gradient(45deg,var(--liner) 0 2px,transparent 2px 12px),
             repeating-linear-gradient(-45deg,var(--liner) 0 2px,transparent 2px 12px),var(--paper2);opacity:.55}
.letter{position:absolute;left:6%;right:6%;top:8%;height:84%;border-radius:4px;background:var(--sheet);
  box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;text-align:center;padding:6%;
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.letter .mono{font-family:"Vibes",cursive;font-size:clamp(34px,10vw,52px);color:var(--gold)}
.pocket{position:absolute;inset:0;pointer-events:none}
.pocket svg{width:100%;height:100%;display:block;filter:drop-shadow(0 -2px 3px rgba(0,0,0,.08))}
.flap{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:50% 0;transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.5,0,.2,1),z-index 0s .45s;z-index:4}
.flap .f,.flap .b{position:absolute;inset:0;backface-visibility:hidden;clip-path:polygon(0 0,100% 0,50% 100%)}
.flap .f{background:linear-gradient(175deg,var(--paper),var(--paper2));}
.flap .b{transform:rotateX(180deg);clip-path:polygon(50% 0,100% 100%,0 100%);background:repeating-linear-gradient(45deg,var(--liner) 0 2px,transparent 2px 12px),var(--paper2)}
.seal{position:absolute;left:50%;top:62%;width:clamp(78px,22vw,104px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;
  border-radius:50%;display:grid;place-items:center;background:transparent;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.seal .half{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--seal) 70%,#fff 30%) 0 8%,var(--seal) 38%,var(--seal2) 100%);
  box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--seal2) 60%,transparent);
  transition:transform .9s cubic-bezier(.3,.6,.3,1),opacity .9s}
.seal .l{clip-path:polygon(0 0,52% 0,46% 30%,55% 52%,44% 74%,50% 100%,0 100%)}
.seal .r{clip-path:polygon(52% 0,100% 0,100% 100%,50% 100%,44% 74%,55% 52%,46% 30%)}
.seal .ini{position:relative;font-family:"Vibes",cursive;color:#f1d79d;font-size:clamp(22px,6.4vw,32px);white-space:nowrap;letter-spacing:-.02em;
  text-shadow:0 1px 0 rgba(0,0,0,.35);pointer-events:none;transition:opacity .3s}
.seal:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(255,226,170,.55);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}

/* открытие */
.open .seal:after{display:none}
.open .seal .ini{opacity:0}
.open .seal .l{transform:translate(-40px,60px) rotate(-35deg);opacity:0}
.open .seal .r{transform:translate(40px,70px) rotate(30deg);opacity:0}
.open .flap{transform:rotateX(178deg);z-index:1}
.open .letter{transform:translateY(-58%)}
.open .intro,.open .hint{opacity:0}

/* ---------- ролик ---------- */
.stage{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .9s;background:#000}
.show .stage{opacity:1;pointer-events:auto}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.over{position:absolute;left:0;right:0;bottom:0;height:40%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 9vw calc(4vh + env(safe-area-inset-bottom));gap:.4em}
.over > *{opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s}
.over .on{opacity:1;transform:none}
.o-title{font-size:clamp(15px,4.2vw,19px);letter-spacing:.14em;color:var(--gold);font-weight:600}
.o-names{font-family:"Vibes",cursive;font-size:clamp(44px,13vw,70px);line-height:1.05;
  background:linear-gradient(var(--n1,#c99a45),var(--n2,#6e4810));-webkit-background-clip:text;background-clip:text;color:transparent}
.o-when{font-size:clamp(20px,5.6vw,26px);font-weight:600}
.o-place{font-size:clamp(16px,4.4vw,20px);color:var(--soft)}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;padding:8px 14px;border-radius:20px;
  background:rgba(255,250,240,.75);font-size:16px;color:var(--ink)}
.sound{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,250,240,.75);display:grid;place-items:center;font-size:18px}

/* ---------- детали ---------- */
.details{position:relative;z-index:30;display:none;min-height:100%;background:var(--sheet);padding:9vh 7vw calc(6vh + env(safe-area-inset-bottom))}
.done .details{display:block}
.done .scene,.done .stage{display:none}
.d-wrap{max-width:460px;margin:0 auto;text-align:center}
.d-hero{width:100%;aspect-ratio:9/12;border-radius:14px;background:center 20%/cover no-repeat;box-shadow:0 14px 30px rgba(58,40,20,.22)}
.d-title{margin-top:28px;font-size:19px;color:var(--gold);letter-spacing:.06em}
.d-names{font-family:"Vibes",cursive;font-size:clamp(46px,13vw,64px);color:var(--ink);line-height:1.1;margin:.1em 0 .2em}
.d-text{font-style:italic;font-size:20px;color:var(--soft)}
.block{margin-top:34px;padding-top:26px;border-top:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.big{font-size:30px;font-weight:600}
.sub{font-size:19px;color:var(--soft);margin-top:4px}
.count{display:flex;justify-content:center;gap:18px;margin-top:18px}
.count div{min-width:62px}
.count b{display:block;font-size:34px;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.count span{font-size:15px;color:var(--soft)}
.btn{display:block;width:100%;margin-top:12px;padding:15px 18px;border-radius:12px;font-size:20px;font-weight:600;text-decoration:none;
  border:1.5px solid var(--gold);color:var(--ink);background:transparent}
.btn.main{background:var(--seal);border-color:var(--seal);color:#fbf2e2}
.rsvp-q{font-size:22px;font-weight:600}
.rsvp-done{font-size:20px;margin-top:14px;color:var(--soft);display:none}
.sent .rsvp-done{display:block}
.foot{margin-top:46px;font-size:16px;color:var(--soft)}
.foot a{color:var(--seal)}
@media (prefers-reduced-motion:reduce){
  .seal:after{animation:none}
  *,*:before,*:after{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main id="app">
  <section class="scene" aria-label="Конверт">
    <div class="backdrop" id="bg"></div>
    <div class="intro"><p id="t-for">Вам приглашение</p><h1 id="t-from"></h1></div>
    <div class="env" id="env">
      <div class="back"></div><div class="liner"></div>
      <div class="letter"><span class="mono" id="mono"></span></div>
      <div class="pocket"><svg viewBox="0 0 100 70" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--paper)"/><stop offset="1" stop-color="var(--paper2)"/></linearGradient></defs>
        <path d="M0 0 L50 40 L0 70 Z" fill="url(#pg)"/><path d="M100 0 L50 40 L100 70 Z" fill="url(#pg)"/>
        <path d="M0 70 L50 34 L100 70 Z" fill="url(#pg)" stroke="rgba(0,0,0,.05)" stroke-width=".3"/></svg></div>
      <div class="flap"><div class="f"></div><div class="b"></div></div>
      <button class="seal" id="seal" aria-label="Открыть конверт"><span class="half l"></span><span class="half r"></span><span class="ini" id="ini"></span></button>
    </div>
    <p class="hint" id="t-hint">Коснитесь печати, чтобы открыть</p>
  </section>

  <section class="stage" aria-label="Видео-приглашение">
    <video id="vid" playsinline preload="auto"></video>
    <audio id="mus" preload="auto" loop></audio>
    <div class="over" id="over">
      <div class="o-title" id="o-title"></div>
      <div class="o-names" id="o-names"></div>
      <div class="o-when" id="o-when"></div>
      <div class="o-place" id="o-place"></div>
    </div>
    <button class="sound" id="snd" aria-label="Звук">🔊</button>
    <button class="skip" id="skip"></button>
  </section>

  <section class="details" aria-label="Подробности">
    <div class="d-wrap">
      <div class="d-hero" id="d-hero" role="img" aria-label=""></div>
      <p class="d-title" id="d-title"></p>
      <p class="d-names" id="d-names"></p>
      <p class="d-text" id="d-text"></p>
      <div class="block">
        <p class="big" id="d-when"></p>
        <div class="count" id="count" hidden>
          <div><b id="c-d">0</b><span id="l-d">дней</span></div>
          <div><b id="c-h">0</b><span id="l-h">часов</span></div>
          <div><b id="c-m">0</b><span id="l-m">минут</span></div>
        </div>
        <a class="btn" id="cal" hidden></a>
      </div>
      <div class="block">
        <p class="big" id="d-place"></p>
        <a class="btn" id="map" target="_blank" rel="noopener"></a>
      </div>
      <div class="block" id="rsvp">
        <p class="rsvp-q" id="r-q"></p>
        <a class="btn main" id="r-yes"></a>
        <a class="btn" id="r-two"></a>
        <a class="btn" id="r-no"></a>
        <p class="rsvp-done" id="r-done"></p>
      </div>
      <button class="btn" id="again"></button>
      <p class="foot" id="foot"></p>
    </div>
  </section>
</main>
<script>
const L = {
  ru: {for:"Вам приглашение", from:"от {x}", hint:"Коснитесь печати, чтобы открыть", skip:"Подробнее",
       d:"дней", h:"часов", m:"минут", cal:"Добавить в календарь", map:"Открыть маршрут", q:"Вы придёте?",
       yes:"Да, приду", two:"Приду вдвоём", no:"К сожалению, не смогу", done:"Спасибо! Ответ отправлен — подтвердите его в Telegram.",
       foot:"Приглашение сделано в {b}. Хотите такое же? Это пара минут.", place:"Место проведения", again:"Посмотреть видео ещё раз"},
  uz: {for:"Sizga taklifnoma", from:"{x}dan", hint:"Ochish uchun muhrga teging", skip:"Batafsil",
       d:"kun", h:"soat", m:"daqiqa", cal:"Kalendarga qoʻshish", map:"Yoʻnalishni ochish", q:"Kelasizmi?",
       yes:"Ha, kelaman", two:"Ikki kishi kelamiz", no:"Afsuski, kela olmayman", done:"Rahmat! Javobingizni Telegramda tasdiqlang.",
       foot:"Taklifnoma {b} orqali yaratildi. Sizga ham kerakmi? Bir necha daqiqa.", place:"Manzil", again:"Videoni qayta koʻrish"},
};
const MOODS = {
  gold:{paper:"#f3ebdd",paper2:"#e6d8bf",liner:"#c9a35a",seal:"#7a1e2b",seal2:"#4f0f19",ink:"#3a2814",gold:"#b8893a",soft:"#6b5236",sheet:"#fbf6ee"},
  east:{paper:"#f1e2cf",paper2:"#e2ccb0",liner:"#a8323a",seal:"#8a1f24",seal2:"#540c11",ink:"#3a1d14",gold:"#a8803a",soft:"#6b4436",sheet:"#fbf3ea"},
  champ:{paper:"#f2e6da",paper2:"#e5d2c0",liner:"#c8a467",seal:"#a8814c",seal2:"#6e4f26",ink:"#45311f",gold:"#b08a4a",soft:"#6e5640",sheet:"#fbf5ef"},
  pastel:{paper:"#f8ecec",paper2:"#efd9da",liner:"#c9a07a",seal:"#b97882",seal2:"#7e4651",ink:"#4f3537",gold:"#b48a6a",soft:"#7a5a5c",sheet:"#fdf7f6"},
  ny_gold:{paper:"#f6efe3",paper2:"#e9dcc4",liner:"#c9a35a",seal:"#7a1e2b",seal2:"#4f0f19",ink:"#3a2814",gold:"#b8893a",soft:"#6b5236",sheet:"#fcf8f1"},
  ny_home:{n1:"#d0a04a",n2:"#8a2c1c",paper:"#f4e8da",paper2:"#e6d3bc",liner:"#b0503a",seal:"#9a2a1e",seal2:"#5e140d",ink:"#3a2014",gold:"#b0703a",soft:"#6b4436",sheet:"#fcf5ec"},
  ny_party:{paper:"#f2e6d6",paper2:"#e4d0b4",liner:"#c8a467",seal:"#a8814c",seal2:"#6e4f26",ink:"#45311f",gold:"#b08a4a",soft:"#6e5640",sheet:"#fbf5ec"},
  ny_fairy:{n1:"#9aa8e8",n2:"#3a447e",paper:"#eef1f9",paper2:"#dde3f2",liner:"#a9b4dc",seal:"#4a5a9a",seal2:"#2a3468",ink:"#262b48",gold:"#6f7bb8",soft:"#4a5070",sheet:"#f8f9fd"},
};
const TIMES = [0.8, 1.8, 7.6, 7.6];   // как в видео-шаблоне: заголовок, имена, детали

async function readData() {
  const h = new URLSearchParams(location.hash.slice(1));
  const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.start_param;
  const raw = h.get("d") || tg || "";
  if (!raw) return {s:"gold", l:"ru", n:"Айбек и Саида", tt:"Приглашение на свадьбу", w:"14 декабря 2026 · 17:00",
                    p:"Свадебный зал «VIP», ул. Навои, 12", c:"Будем рады видеть вас!", dt:"2026-12-14T17:00", b:"TabrikTaklifUzBot", i:""};
  const bin = Uint8Array.from(atob(raw.replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}
const $ = id => document.getElementById(id);
const fmt = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k] ?? "");

readData().then(D => {
  const t = L[D.l] || L.ru, mood = MOODS[D.s] ? D.s : "gold";
  for (const [k, v] of Object.entries(MOODS[mood])) document.documentElement.style.setProperty("--" + k, v);
  document.documentElement.lang = D.l || "ru";
  const parts = D.n.split(/\s+(?:и|va|&|ва)\s+/i);
  const ini = parts.length > 1 ? parts[0][0] + "&" + parts[1][0] : D.n.trim()[0];
  $("bg").style.backgroundImage = `url(p/${mood}_blur.jpg)`;
  $("t-for").textContent = t.for; $("t-from").textContent = D.n; $("t-hint").textContent = t.hint;
  $("ini").textContent = ini; $("mono").textContent = ini; $("skip").textContent = t.skip;
  $("o-title").textContent = D.tt; $("o-names").textContent = D.n; $("o-when").textContent = D.w; $("o-place").textContent = D.p;
  $("d-hero").style.backgroundImage = `url(p/${mood}_couple.jpg)`;
  $("d-title").textContent = D.tt; $("d-names").textContent = D.n; $("d-text").textContent = D.c || "";
  $("d-when").textContent = D.w; $("d-place").textContent = D.p;
  $("map").textContent = t.map; $("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(D.p);
  $("r-q").textContent = t.q; $("r-yes").textContent = t.yes; $("r-two").textContent = t.two; $("r-no").textContent = t.no;
  $("r-done").textContent = t.done;
  $("foot").innerHTML = fmt(t.foot, {b: `<a href="https://t.me/${D.b}">@${D.b}</a>`});
  if (D.i && D.b) {
    for (const [id, a] of [["r-yes","y"],["r-two","p"],["r-no","n"]]) {
      $(id).href = `https://t.me/${D.b}?start=r_${D.i}_${a}`;
      $(id).addEventListener("click", () => $("rsvp").classList.add("sent"));
    }
  } else $("rsvp").hidden = true;

  // таймер и календарь
  if (D.dt) {
    const when = new Date(D.dt);
    $("l-d").textContent = t.d; $("l-h").textContent = t.h; $("l-m").textContent = t.m;
    const tick = () => { let s = Math.max(0, (when - new Date()) / 1000);
      $("c-d").textContent = Math.floor(s / 86400); $("c-h").textContent = Math.floor(s % 86400 / 3600); $("c-m").textContent = Math.floor(s % 3600 / 60); };
    tick(); setInterval(tick, 30000); $("count").hidden = false;
    const z = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const end = new Date(when.getTime() + 4 * 3600e3);
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`DTSTART:${z(when)}`,`DTEND:${z(end)}`,
                 `SUMMARY:${D.tt} — ${D.n}`,`LOCATION:${D.p}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
    $("cal").href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics); $("cal").download = "invitation.ics";
    $("cal").textContent = t.cal; $("cal").hidden = false;
  }

  const vid = $("vid"), mus = $("mus");
  vid.src = `v/story_${mood}.mp4`; mus.src = `m/${mood}.mp3`;
  let opened = false;
  const reveal = () => {
    const tm = vid.currentTime;
    [...$("over").children].forEach((el, k) => el.classList.toggle("on", tm >= TIMES[k]));
    if (!vid.ended) requestAnimationFrame(reveal);
  };
  const finish = () => { document.body.classList.add("done"); window.scrollTo(0, 0); };
  $("seal").addEventListener("click", () => {
    if (opened) return; opened = true;
    if (navigator.vibrate) navigator.vibrate(30);
    $("app").classList.add("open");
    vid.muted = false;
    mus.play().catch(() => {});           // музыка — если файл есть
    setTimeout(() => { document.body.classList.add("show"); vid.play().catch(() => { vid.muted = true; vid.play(); }); reveal(); }, 1500);
  });
  vid.addEventListener("ended", () => setTimeout(finish, 1200));
  $("skip").addEventListener("click", () => { vid.pause(); finish(); });
  $("again").textContent = t.again;
  $("again").addEventListener("click", () => { document.body.classList.remove("done"); vid.currentTime = 0; vid.play(); reveal(); });
  $("snd").addEventListener("click", () => { mus.muted = !mus.muted; $("snd").textContent = mus.muted ? "🔇" : "🔊"; });
  mus.addEventListener("error", () => { $("snd").hidden = true; });
}).catch(() => { document.body.innerHTML = "<p style='color:#fff;padding:40px;font-size:20px'>Ссылка на приглашение повреждена. Попросите отправителя прислать её ещё раз.</p>"; });
</script>
</body>
</html>
